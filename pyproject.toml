[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscribe"
version = "0.2.0a1"
description = "Evidence-first modular vulnerability analysis MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "typer>=0.12,<1.0", "rich>=13.7,<15.0", "jinja2>=3.1,<4.0"]

[project.optional-dependencies]
pdf = ["weasyprint>=62,<70"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vulnscribe = "vulnscribe.cli.main:app"

[tool.setuptools.packages.find]
include = ["vulnscribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint.per-file-ignores]
"vulnscribe/scanners/static_code.py" = ["C408"]
"vulnscribe/cli/main.py" = ["B008"]

[tool.setuptools.package-data]
vulnscribe = ["static/*.html", "static/*.css", "static/*.js"]
